name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # numpy is needed to import aether_daemon (pulled in by the config-wiring
      # test); pytest is for the optional pytest run. openrgb is intentionally
      # omitted — the config-wiring test stubs it, and no RGB hardware exists in
      # CI. No PipeWire, curses, systemd, or live audio is required.
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pytest

      - name: Byte-compile all modules
        run: >-
          python -m py_compile
          aether_shm.py
          aether_daemon.py
          aether_client.py
          aether_config.py
          aether_rgb.py
          aether.py
          config_model.py
          render.py
          ui/__init__.py
          ui/overlays.py
          test_config_wiring.py
          test_aether_shm_seqlock.py
          test_config_model.py
          test_render.py

      - name: Seqlock protocol tests (direct)
        run: python test_aether_shm_seqlock.py

      - name: Config-wiring tests (direct)
        run: python test_config_wiring.py

      - name: Config model tests (direct)
        run: python test_config_model.py

      - name: Render primitive tests (direct)
        run: python test_render.py

      - name: Test suite (pytest)
        run: python -m pytest test_config_wiring.py test_aether_shm_seqlock.py test_config_model.py test_render.py -q
